name: CPU build and tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Configure and build
        run: |
          cmake -S . -B build/ci -DNEEDLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(command -v python)"
          cmake --build build/ci -j 2
      - name: Test
        env:
          PYTHONPATH: build/ci/python
        run: python -m pytest -q tests
      - name: Smoke benchmarks
        env:
          PYTHONPATH: build/ci/python
        run: |
          python benchmarks/gemm.py --device cpu --modes baseline --shapes 17x33x19 --warmup 1 --iterations 2
          python benchmarks/transformer_ablation.py --device cpu --batch 1 --seq 4 --dim 16 --heads 2 --warmup 1 --iterations 2
